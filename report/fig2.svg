<svg viewBox="0 0 680 292" xmlns="http://www.w3.org/2000/svg" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><text x="4.0" y="16.0" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" >エンジン（1度に1トランザクション）</text><rect x="4" y="26" width="150" height="54" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="0.9"/><text x="79.0" y="49.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >挿入・削除</text><text x="79.0" y="65.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >ページをBuffer Poolで変更</text><rect x="178" y="26" width="150" height="54" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="0.9"/><text x="253.0" y="41.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >コミット前は</text><text x="253.0" y="57.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >データファイルに書かない</text><text x="253.0" y="73.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >（NO-STEAL）</text><rect x="352" y="26" width="150" height="54" rx="3" fill="#eef4f1" stroke="#1f5f46" stroke-width="0.9"/><text x="427.0" y="41.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >WALに変更ページの写しと</text><text x="427.0" y="57.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >COMMIT記録を追記</text><text x="427.0" y="73.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >→ fsync</text><rect x="526" y="26" width="150" height="54" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="0.9"/><text x="601.0" y="49.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >コミット完了を返す</text><text x="601.0" y="65.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >（ACK）</text><line x1="154" y1="53.0" x2="175" y2="53.0" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#ah)"/><line x1="328" y1="53.0" x2="349" y2="53.0" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#ah)"/><line x1="502" y1="53.0" x2="523" y2="53.0" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#ah)"/><rect x="178" y="100" width="324" height="44" rx="3" fill="#fff" stroke="#8a8f94" stroke-width="0.9"/><text x="340.0" y="118.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >チェックポイント（WALが512KBを超えたコミットで）</text><text x="340.0" y="134.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >ページをデータファイルへ書く → fsync → WALを空にする</text><rect x="178" y="152" width="324" height="44" rx="3" fill="#fff" stroke="#8a8f94" stroke-width="0.9"/><text x="340.0" y="170.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >起動時の復旧</text><text x="340.0" y="186.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >WALにあるCOMMIT済みのページだけをデータファイルへ書き戻す</text><text x="6.0" y="127.0" font-size="11" text-anchor="start" fill="#555" font-weight="normal" >ACKを返す前に</text><text x="6.0" y="178.0" font-size="11" text-anchor="start" fill="#555" font-weight="normal" >kill -9 の後</text><line x1="4" y1="206" x2="676" y2="206" stroke="#c8cdd0" stroke-width="0.6"/><text x="4.0" y="222.0" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="bold" >テスト側の記録（台帳、1行ごとにfsync）</text><rect x="4" y="232" width="150" height="46" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="0.9"/><text x="79.0" y="251.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >操作の内容と</text><text x="79.0" y="267.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >「S」（コミット開始）</text><rect x="178" y="232" width="324" height="46" rx="3" fill="#fff" stroke="#8a8f94" stroke-width="0.9"/><text x="340.0" y="251.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >commit() を呼ぶ（中でACKが返る）</text><text x="340.0" y="267.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >Cを書く前に殺されたものは「未確定」</text><rect x="526" y="232" width="150" height="46" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="0.9"/><text x="601.0" y="259.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="normal" >「C」（ACKを受けた）</text><line x1="154" y1="255" x2="175" y2="255" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#ah)"/><line x1="502" y1="255" x2="523" y2="255" stroke="#1a1a1a" stroke-width="1.1" marker-end="url(#ah)"/></svg>